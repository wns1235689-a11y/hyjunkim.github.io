<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없음 | 김형준</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--ink:#15233F;--ink-soft:#4A5870;--line:#DDE3EC;--gate:#F2A91E;--console:#0F1828;--console-text:#D9E2F2;--console-dim:#8DA0C4;
--sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--console);color:var(--console-text);font-family:var(--sans);border-left:12px solid var(--gate)}
main{max-width:640px;padding:48px 28px}
.eyebrow{font-family:var(--mono);font-size:14px;color:var(--console-dim);margin:0 0 16px;letter-spacing:.04em}
h1{font-size:clamp(28px,5vw,44px);line-height:1.2;margin:0 0 16px;color:#fff;font-weight:800;letter-spacing:-.02em}
p{margin:0 0 28px;line-height:1.6;color:var(--console-text)}
a.btn{display:inline-block;font-weight:700;color:var(--ink);background:var(--gate);padding:12px 20px;border-radius:10px;text-decoration:none}
a.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
code{font-family:var(--mono);color:var(--console-dim)}
</style>
</head>
<body>
<main>
  <p class="eyebrow">404 · NOT FOUND</p>
  <h1>이 주소에는 페이지가 없다.</h1>
  <p>주소가 바뀌었거나 아직 공개되지 않은 페이지다. 전체 프로젝트 목록에서 다시 찾을 수 있다.</p>
  <a class="btn" href="/">← 전체 프로젝트</a>
</main>
</body>
</html>
